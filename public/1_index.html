<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CharchaHub</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #efeae2;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        nav {
            background-color: black;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
        }

        .charcha { color: white; }

        .hub {
            background-color: orange;
            color: black;
            padding: 0.2rem 0.5rem;
            border-radius: 5px;
            margin-left: 4px;
        }

        #online {
            color: #25d366;
            font-size: 0.85rem;
            font-weight: 600;
        }

        #messages {
            list-style-type: none;
            margin: 0;
            padding: 1rem;
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        #messages > li {
            max-width: 70%;
            padding: 0.5rem 0.75rem;
            margin: 0.35rem 0;
            border-radius: 0.75rem;
            font-size: 0.95rem;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            background-color: #ffffff;
            align-self: flex-start;
        }

        /* Own messages align right and get the green bubble. */
        #messages > li.mine {
            background-color: #dcf8c6;
            align-self: flex-end;
        }

        #messages > li .meta {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            color: #075e54;
            margin-bottom: 0.15rem;
        }

        #messages > li .time {
            font-weight: 400;
            color: #888;
            margin-left: 0.4rem;
        }

        /* Centered system messages (join/leave). */
        #messages > li.system {
            align-self: center;
            background: rgba(0, 0, 0, 0.06);
            box-shadow: none;
            color: #555;
            font-size: 0.78rem;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
        }

        #typing {
            min-height: 1.1rem;
            padding: 0 1rem;
            font-size: 0.8rem;
            font-style: italic;
            color: #777;
        }

        #form {
            background-color: #f0f0f0;
            padding: 0.5rem;
            display: flex;
            align-items: center;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }

        #input {
            flex-grow: 1;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 1.5rem;
            font-size: 1rem;
            background-color: #fff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            margin-right: 0.5rem;
        }

        #input:focus {
            outline: none;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        #form > button {
            background-color: #25d366;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 1.5rem;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        #form > button:hover { background-color: #20ba5b; }

        @media (max-width: 768px) {
            h1 { font-size: 1.25rem; }
            #form > button { padding: 0.5rem 1rem; font-size: 0.9rem; }
            #messages > li { font-size: 0.85rem; max-width: 85%; }
        }
    </style>
</head>
<body>
    <nav>
        <h1><span class="charcha">Charcha</span><span class="hub">Hub</span></h1>
        <span id="online">0 online</span>
    </nav>

    <ul id="messages"></ul>
    <div id="typing"></div>

    <form id="form" action="">
        <input id="input" autocomplete="off" placeholder="Type a message..." />
        <button>Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        var socket = io();

        var messages = document.getElementById("messages");
        var form = document.getElementById("form");
        var input = document.getElementById("input");
        var typingEl = document.getElementById("typing");
        var onlineEl = document.getElementById("online");

        // Our own socket id, learned from the server's "welcome" event.
        var myId = null;

        // Ask for a username and announce ourselves to the server.
        var username = (prompt("Enter your name") || "").trim().slice(0, 24) || "Anonymous";
        socket.emit("join", username);

        function scrollToBottom() {
            messages.scrollTop = messages.scrollHeight;
        }

        function formatTime(ts) {
            var d = new Date(ts);
            return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        }

        // Render a chat bubble. textContent keeps user input XSS-safe.
        function addMessage(msg) {
            var li = document.createElement("li");
            if (msg.id === myId) li.classList.add("mine");

            var meta = document.createElement("span");
            meta.className = "meta";
            meta.textContent = msg.user;

            var time = document.createElement("span");
            time.className = "time";
            time.textContent = formatTime(msg.time);
            meta.appendChild(time);

            var body = document.createElement("span");
            body.textContent = msg.text;

            li.appendChild(meta);
            li.appendChild(body);
            messages.appendChild(li);
            scrollToBottom();
        }

        function addSystem(text) {
            var li = document.createElement("li");
            li.className = "system";
            li.textContent = text;
            messages.appendChild(li);
            scrollToBottom();
        }

        socket.on("welcome", function (data) {
            myId = data.id;
        });

        socket.on("history", function (list) {
            (list || []).forEach(addMessage);
        });

        socket.on("chat message", addMessage);

        socket.on("system", addSystem);

        socket.on("online", function (count) {
            onlineEl.textContent = count + " online";
        });

        // --- Typing indicator ---
        var typingUsers = {};
        var typingTimer = null;

        function renderTyping() {
            var names = Object.keys(typingUsers);
            if (names.length === 0) {
                typingEl.textContent = "";
            } else if (names.length === 1) {
                typingEl.textContent = names[0] + " is typing...";
            } else {
                typingEl.textContent = names.length + " people are typing...";
            }
        }

        socket.on("typing", function (data) {
            if (data.isTyping) typingUsers[data.user] = true;
            else delete typingUsers[data.user];
            renderTyping();
        });

        var amTyping = false;
        var stopTimer = null;

        input.addEventListener("input", function () {
            if (!amTyping) {
                amTyping = true;
                socket.emit("typing", true);
            }
            clearTimeout(stopTimer);
            stopTimer = setTimeout(function () {
                amTyping = false;
                socket.emit("typing", false);
            }, 1200);
        });

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            if (input.value.trim()) {
                socket.emit("chat message", input.value);
                input.value = "";
                amTyping = false;
                socket.emit("typing", false);
            }
        });
    </script>
</body>
</html>
